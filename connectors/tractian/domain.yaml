# O domain não descreve HTTP. Ele registra como o domínio industrial será apresentado
# ao classificador de intenção, à UI e, futuramente, ao agente.
id: tractian
language: pt-BR
context_fields:
  # Estes campos formam o contexto mínimo esperado para fundamentar autorização e evidência.
  - user_id
  - company_id
  - asset_id
  - case_id

terminology:
  # Definições curtas evitam espalhar vocabulário industrial pelo código Python.
  asset: ativo industrial monitorado
  analysis: diagnóstico produzido a partir dos sinais do ativo
  baseline: estado normal aprendido para um ativo ou ponto de medição
  data_quality: completude, frescor e relação sinal-ruído dos dados
  investigation_evidence: fontes complementares de configuração, baseline, qualidade e sinais que sustentam uma investigação
  specialist_analysis: análise técnica especializada solicitada por meio de requestSpecialistAnalysis
  human_escalation: encaminhamento humano do caso por meio de escalateCase

intents:
  # Cada intenção referencia operationIds do OpenAPI, não URLs. Isso permite que o
  # planejamento continue estável mesmo se a API mudar um path.
  - id: contextualizar
    description: Identificar pessoa usuária, empresa, ativo e permissões.
    evidence_operations: [getCurrentUser, getCompany, getAsset]
    result_decision: orient
  - id: investigar
    description: Investigar causa de falha combinando identidade do ativo, baseline, qualidade dos dados e ao menos um sinal observado antes de concluir; fontes parciais, indisponíveis ou conflitantes exigem limitação explícita e podem justificar escalonamento humano.
    evidence_operations:
      - listAnalyses
      - getAnalysis
      - getBaseline
      - getRmsSeries
      - getSpectrum
      - getDataQuality
      - getModel
      - searchKnowledge
      - getKnowledgeDoc
  - id: agir
    description: Propor ou executar uma operação mutável autorizada; pedido de análise técnica especializada usa requestSpecialistAnalysis, enquanto encaminhamento para atendimento humano usa escalateCase.
    result_decision: act
    action_operations:
      - updateAssetConfig
      - reprocessAnalysis
      - requestSpecialistAnalysis
      - requestRetraining
  - id: escalar
    description: Encaminhar um caso para atendimento humano com escalateCase quando a evidência ou a autoridade forem insuficientes; não confundir com requestSpecialistAnalysis, que solicita análise técnica.
    result_decision: escalate
    action_operations: [escalateCase]

evidence_states:
  # A API retorna estes estados dentro do JSON, inclusive quando o HTTP é 200.
  - complete
  - partial
  - inconclusive
  - conflict
  - unavailable
