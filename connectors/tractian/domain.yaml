# O domain não descreve HTTP. Ele registra como o domínio industrial será apresentado
# ao classificador de intenção, à UI e, futuramente, ao agente.
id: tractian
language: pt-BR
context_fields:
  # Estes campos formam o contexto mínimo esperado para fundamentar autorização e evidência.
  - user_id
  - company_id
  - asset_id
  - case_id

terminology:
  # Definições curtas evitam espalhar vocabulário industrial pelo código Python.
  asset: ativo industrial monitorado
  analysis: diagnóstico produzido a partir dos sinais do ativo
  baseline: estado normal aprendido para um ativo ou ponto de medição
  data_quality: completude, frescor e relação sinal-ruído dos dados
  escalation: encaminhamento explícito do caso para análise humana

intents:
  # Cada intenção referencia operationIds do OpenAPI, não URLs. Isso permite que o
  # planejamento continue estável mesmo se a API mudar um path.
  - id: contextualizar
    description: Identificar pessoa usuária, empresa, ativo e permissões.
    evidence_operations: [getCurrentUser, getCompany, getAsset]
  - id: investigar
    description: Consultar análises, sinais, baseline, modelo e conhecimento técnico.
    evidence_operations:
      - listAnalyses
      - getAnalysis
      - getBaseline
      - getRmsSeries
      - getSpectrum
      - getDataQuality
      - getModel
      - searchKnowledge
      - getKnowledgeDoc
  - id: agir
    description: Propor ou executar uma operação mutável autorizada.
    action_operations:
      - updateAssetConfig
      - reprocessAnalysis
      - requestSpecialistAnalysis
      - requestRetraining
  - id: escalar
    description: Encaminhar um caso quando a evidência ou a autoridade forem insuficientes.
    action_operations: [escalateCase]

evidence_states:
  # A API retorna estes estados dentro do JSON, inclusive quando o HTTP é 200.
  - complete
  - partial
  - inconclusive
  - conflict
  - unavailable
