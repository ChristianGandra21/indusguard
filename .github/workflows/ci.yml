name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API · lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: indusguard_test
          POSTGRES_USER: indusguard
          POSTGRES_PASSWORD: indusguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indusguard -d indusguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INDUSGUARD_DATABASE_URL: postgresql://indusguard:indusguard@localhost:5432/indusguard_test
      INDUSGUARD_TEST_POSTGRES_URL: postgresql://indusguard:indusguard@localhost:5432/indusguard_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            evals/pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install -e "./apps/api[dev]"
          python -m pip install -e "./evals[fixture,dev]"

      - name: Validar estilo
        run: |
          ruff check apps/api
          ruff check evals
          ruff format --check apps/api evals

      - name: Verificar snapshot OpenAPI
        run: |
          python apps/api/scripts/export_openapi.py apps/web/openapi/indusguard.openapi.json
          git diff --exit-code -- apps/web/openapi/indusguard.openapi.json

      - name: Aplicar e verificar migrações PostgreSQL
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check

      - name: Testar API e conectores
        run: pytest apps/api --cov=indusguard_api --cov-report=term-missing

      - name: Testar benchmark e isolamento do golden
        run: pytest -c evals/pyproject.toml evals/tests --cov=indusguard_evals --cov-config=evals/pyproject.toml --cov-report=term-missing

      - name: Validar corpus e smoke offline
        run: |
          indusguard-eval validate
          indusguard-eval pilot --fake

      - name: Verificar wheel de produção
        run: |
          python -m pip wheel --no-deps ./apps/api -w /tmp/indusguard-wheel
          python evals/scripts/verify_runtime_wheel.py /tmp/indusguard-wheel/indusguard_api-0.1.0-py3-none-any.whl

  frontend:
    name: Web · contratos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar frontend e backend do E2E
        run: |
          npm ci --prefix apps/web
          python -m venv .venv
          .venv/bin/python -m pip install -e "./apps/api[dev]"

      - name: Verificar tipos gerados
        run: |
          npm --prefix apps/web run api:generate
          git diff --exit-code -- apps/web/src/lib/api-types.generated.ts

      - name: Lint, tipagem, testes e exportação estática
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build
          npm --prefix apps/web run verify:isolation

      - name: Instalar Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Teste fullstack FastAPI + SQLite
        working-directory: apps/web
        env:
          CI: "1"
        run: npm run test:e2e

  runtime-image:
    name: Runtime · imagem, SBOM e vulnerabilidades
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagem local
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/api.Dockerfile
          load: true
          tags: indusguard-api:ci

      - name: Smoke de migração, usuário e readiness
        run: |
          docker run --detach --name indusguard-smoke --publish 18000:10000 \
            --env PORT=10000 \
            --env INDUSGUARD_DATABASE_URL=sqlite+aiosqlite:////tmp/indusguard.db \
            --env INDUSGUARD_PUBLIC_RUNS_ENABLED=false \
            --env INDUSGUARD_TRACE_JSONL_ENABLED=false \
            indusguard-api:ci
          trap 'docker logs indusguard-smoke; docker rm --force indusguard-smoke' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/ready.json"))["status"] == "ready"'
          test "$(docker inspect indusguard-smoke --format '{{.Config.User}}')" = "10001:10001"

      - name: Verificar isolamento do runtime
        run: |
          docker run --rm --entrypoint /bin/sh indusguard-api:ci -c '
            test ! -e /app/evals &&
            test ! -e /app/apps/web &&
            test ! -e /app/.env &&
            test -z "$(find /app -type f \( -iname "*.parquet" -o -iname "*golden*" \) -print -quit)"
          '

      - name: Gerar SBOM SPDX
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: indusguard-api:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Publicar SBOM do workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indusguard-api-sbom
          path: sbom.spdx.json

      - name: Bloquear vulnerabilidades altas ou críticas
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: indusguard-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
