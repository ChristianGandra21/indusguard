name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API · lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependências
        run: python -m pip install -e "./apps/api[dev]"

      - name: Validar estilo
        run: |
          ruff check apps/api
          ruff format --check apps/api

      - name: Testar API e conectores
        run: pytest apps/api --cov=indusguard_api --cov-report=term-missing
