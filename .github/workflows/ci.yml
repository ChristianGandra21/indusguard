name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API · lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: indusguard_test
          POSTGRES_USER: indusguard
          POSTGRES_PASSWORD: indusguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indusguard -d indusguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INDUSGUARD_DATABASE_URL: postgresql://indusguard:indusguard@localhost:5432/indusguard_test
      INDUSGUARD_TEST_POSTGRES_URL: postgresql://indusguard:indusguard@localhost:5432/indusguard_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            evals/pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install -e "./apps/api[dev]"
          python -m pip install -e "./evals[fixture,dev]"

      - name: Validar estilo
        run: |
          ruff check apps/api
          ruff check evals
          ruff format --check apps/api evals

      - name: Verificar snapshot OpenAPI
        run: |
          python apps/api/scripts/export_openapi.py apps/web/openapi/indusguard.openapi.json
          git diff --exit-code -- apps/web/openapi/indusguard.openapi.json

      - name: Aplicar e verificar migrações PostgreSQL
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check

      - name: Testar API e conectores
        run: pytest apps/api --cov=indusguard_api --cov-report=term-missing

      - name: Testar benchmark e isolamento do golden
        run: pytest -c evals/pyproject.toml evals/tests --cov=indusguard_evals --cov-config=evals/pyproject.toml --cov-report=term-missing

      - name: Validar corpus e smoke offline
        run: |
          indusguard-eval validate
          indusguard-eval pilot --fake

      - name: Verificar wheel de produção
        run: |
          python -m pip wheel --no-deps ./apps/api -w /tmp/indusguard-wheel
          python evals/scripts/verify_runtime_wheel.py /tmp/indusguard-wheel/indusguard_api-0.1.0-py3-none-any.whl

  frontend:
    name: Web · contratos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar frontend e backend do E2E
        run: |
          npm ci --prefix apps/web
          python -m venv .venv
          .venv/bin/python -m pip install -e "./apps/api[dev]"

      - name: Verificar tipos gerados
        run: |
          npm --prefix apps/web run api:generate
          git diff --exit-code -- apps/web/src/lib/api-types.generated.ts

      - name: Lint, tipagem, testes e exportação estática
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build
          npm --prefix apps/web run verify:isolation

      - name: Instalar Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Teste fullstack FastAPI + SQLite
        working-directory: apps/web
        env:
          CI: "1"
        run: npm run test:e2e
