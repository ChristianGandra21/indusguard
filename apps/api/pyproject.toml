[build-system]
# Hatchling empacota somente o backend Python; frontend e conectores continuam na raiz do monorepo.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "indusguard-api"
version = "0.1.0"
description = "API e runtime genérico de conectores OpenAPI do IndusGuard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # FastAPI/Pydantic expõem contratos tipados; Uvicorn serve a aplicação ASGI.
  "fastapi>=0.115,<1.0",
  # httpx será usado pelo executor e já fornece transporte ASGI para os testes.
  "httpx>=0.27,<1.0",
  # O primeiro corte do executor valida argumentos com o JSON Schema declarado no OpenAPI.
  "jsonschema>=4.23,<5.0",
  # O SDK MCP v2 fornece o protocolo interno e o cliente em memória usado nos testes de aceitação.
  "mcp>=2.0,<3.0",
  # LangGraph coordena o fluxo explícito; langchain-core define mensagens e tools dinâmicas.
  "langgraph>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  # Somente este adaptador fala com a faixa gratuita da Groq; não há fallback pago ou Ollama.
  "langchain-groq>=1.0,<2.0",
  # Persistência assíncrona usa a mesma camada para SQLite local e PostgreSQL/Neon.
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "aiosqlite>=0.20,<1.0",
  # Psycopg 3 preserva sslmode e channel_binding das URLs atuais do Neon e oferece asyncio nativo.
  "psycopg[binary]>=3.2,<4.0",
  # OpenTelemetry produz traces locais JSONL e permite OTLP opcional sem prender o núcleo ao Grafana.
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
  # Validação estrutural complementa as restrições locais implementadas em connectors.py.
  "openapi-spec-validator>=0.7,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
# Estas bibliotecas não entram no runtime mínimo de produção.
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
# O layout src/ evita importar acidentalmente arquivos da raiz durante o desenvolvimento.
packages = ["src/indusguard_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings -m 'not live'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: usa a Groq real e só roda quando GROQ_API_KEY está presente",
  "postgres: usa um PostgreSQL temporário e é excluído quando DATABASE_URL não está presente",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Regras focadas em erros, imports, modernização e simplificações seguras.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["indusguard_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
