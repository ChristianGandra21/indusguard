[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "indusguard-api"
version = "0.1.0"
description = "API e runtime genérico de conectores OpenAPI do IndusGuard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openapi-spec-validator>=0.7,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/indusguard_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["indusguard_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
